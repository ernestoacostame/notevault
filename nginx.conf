## ═══════════════════════════════════════════════════════
##  NoteVault - Configuración Nginx + PHP-FPM
## ═══════════════════════════════════════════════════════
##
##  1. Copia esta config a /etc/nginx/sites-available/notevault
##  2. Crea symlink: ln -s /etc/nginx/sites-available/notevault /etc/nginx/sites-enabled/
##  3. Ajusta 'server_name' y 'root' según tu servidor
##  4. Reinicia: sudo systemctl reload nginx
##

server {
    listen 80;
    server_name notas.tudominio.com;  # ← Cambia esto

    # Redirigir a HTTPS (recomendado con Certbot/Let's Encrypt)
    # return 301 https://$host$request_uri;

    root /var/www/notevault;          # ← Cambia esto al directorio donde copies los archivos
    index index.html;

    # ─── Seguridad ───
    # Proteger el directorio de datos
    location /data/ {
        deny all;
        return 403;
    }

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── PHP API ───
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;   # ← Ajusta versión PHP
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts para escritura
        fastcgi_read_timeout 30;
    }

    # ─── Archivos estáticos ───
    location ~* \.(html|css|js|json|ico|svg|png|jpg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Service Worker ───
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ─── SPA fallback ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Gzip ───
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}

## ═══════════════════════════════════════════════════════
##  Para HTTPS con Let's Encrypt:
##
##    sudo apt install certbot python3-certbot-nginx
##    sudo certbot --nginx -d notas.tudominio.com
##
