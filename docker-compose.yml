services:
  # Servicio de PHP
  app:
    build: .
    container_name: notevault_app
    restart: always
    volumes:
      - ./:/var/www/html
    networks:
      - notevault_net

  # Servicio de Nginx
  web:
    image: nginx:alpine
    container_name: notevault_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - notevault_net

networks:
  notevault_net:
    driver: bridge
